name: Roll back JRVX ID staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: Previous jrvx-id-next Worker version UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jrvx-id-staging
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: jrvx-id-staging
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm rollback:staging "$JRVX_PREVIOUS_VERSION"
        env:
          JRVX_PREVIOUS_VERSION: ${{ inputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.JRVX_ID_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b265d7e6d8f3bdf08a58ee25bda178f1
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm smoke:staging
