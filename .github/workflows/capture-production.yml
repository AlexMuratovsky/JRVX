name: Capture production JRVX

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-production.yml"
      - "scripts/rebrand_capture.py"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture production site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-capture
          python - <<'PY'
          import os, re, urllib.parse, urllib.request

          primary_base = "https://jrvx.ru/"
          fallback_base = "https://planhelper-alemura.gleb-v-markevich.chatgpt.site/"
          out = "production-capture"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get("Content-Type","")

          try:
              body, ctype = get(primary_base)
              base = primary_base
              print("using primary JRVX domain", base)
          except Exception as e:
              print("primary JRVX domain unavailable; using fallback:", e)
              body, ctype = get(fallback_base)
              base = fallback_base

          open(os.path.join(out, "index.html"), "wb").write(body)
          text = body.decode("utf-8", "ignore")

          urls = set()
          for pat in [
              r'''(?:src|href)=["']([^"']+)["']''',
              r'''url\((?:["']?)([^)"']+)'''
          ]:
              urls.update(re.findall(pat, text, flags=re.I))

          for raw in sorted(urls):
              if raw.startswith(("data:", "mailto:", "tel:", "#", "javascript:")):
                  continue
              url = urllib.parse.urljoin(base, raw)
              parsed = urllib.parse.urlparse(url)
              if parsed.netloc != urllib.parse.urlparse(base).netloc:
                  continue
              path = parsed.path.lstrip("/") or "index"
              if path.endswith("/"):
                  path += "index.html"
              dest = os.path.join(out, path)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              try:
                  data, _ = get(url)
                  open(dest, "wb").write(data)
                  print("captured", url, "->", dest)
              except Exception as e:
                  print("skip", url, e)

          open(os.path.join(out, "SOURCE_URL.txt"), "w", encoding="utf-8").write(base+"\n")
          open(os.path.join(out, "PRIMARY_URL.txt"), "w", encoding="utf-8").write(primary_base+"\n")
          PY

      - name: Preserve exact source capture
        shell: bash
        run: |
          cp -a production-capture production-capture-raw

      - name: Apply JRVX public branding
        shell: bash
        run: |
          python scripts/rebrand_capture.py production-capture

      - name: Verify public legacy branding is gone
        shell: bash
        run: |
          if grep -RIl --binary-files=without-match "JARVIS" production-capture; then
            echo "Found legacy public branding after rebrand."
            exit 1
          fi

      - name: Sync verified JRVX snapshot into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production-snapshot
          mkdir -p production-snapshot
          rsync -a --delete --exclude "cdn-cgi/" production-capture/ production-snapshot/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A production-snapshot

          if git diff --cached --quiet; then
            echo "Production snapshot is already current."
          else
            git commit -m "Update JRVX production snapshot [skip ci]"
            git push
          fi

      - name: Upload JRVX production bundle
        uses: actions/upload-artifact@v4
        with:
          name: jrvx-production-capture
          path: production-capture

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-source-capture
          path: production-capture-raw
