name: Check JRVX Planner

on:
  push:
    paths:
      - "planner/**"
      - ".github/workflows/planner-ci.yml"
  pull_request:
    paths:
      - "planner/**"
      - ".github/workflows/planner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: planner/source
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.0"
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.25.0"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Planner integration tests
        run: pnpm test
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build standalone Planner application
        run: |
          pnpm build
          node scripts/prepare-standalone.mjs
      - name: Validate Cloudflare Worker without deploying
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --config wrangler.jsonc --dry-run
      - name: Check REG.RU PHP gateway syntax
        run: php -l ../gateway/index.php
      - name: Lint Planner sources
        run: pnpm lint
