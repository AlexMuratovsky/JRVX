name: Deploy JRVX ID staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrvx-id-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Run manually after merging the reviewed recovery into main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: jrvx-id-staging
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.JRVX_ID_STAGING_CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set JRVX_ID_STAGING_CLOUDFLARE_API_TOKEN in the jrvx-id-staging environment."; exit 1; }
      - run: pnpm deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.JRVX_ID_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b265d7e6d8f3bdf08a58ee25bda178f1
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm smoke:staging
