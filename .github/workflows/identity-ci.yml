name: Check JRVX ID

on:
  push:
    paths: ["identity/**", ".github/workflows/identity-*.yml"]
  pull_request:
    paths: ["identity/**", ".github/workflows/identity-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check PHP gateway syntax
        run: |
          php --version
          php -l gateway/index.php
          php -l gateway/config.example.php
      - run: pnpm test
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: "false"
