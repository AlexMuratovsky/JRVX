name: Check JRVX CAS

on:
  push:
    paths: ["cas/**", ".github/workflows/cas-ci.yml", ".gitattributes"]
  pull_request:
    paths: ["cas/**", ".github/workflows/cas-ci.yml", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check all available UI and public JavaScript
        run: |
          find cas/runtime cas/public -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - run: node --test cas/test/*.test.cjs
      - name: Build and validate public overlay
        run: |
          python3 cas/package-reg.py
          python3 cas/verify-release.py
